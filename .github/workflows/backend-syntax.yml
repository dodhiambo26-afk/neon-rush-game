name: Backend syntax check

on:
  pull_request:
    paths:
      - "backend/**"
      - "index.html"
      - ".github/workflows/backend-syntax.yml"
  push:
    branches:
      - "feature/mpesa-monthly-membership"
    paths:
      - "backend/**"
      - "index.html"
      - ".github/workflows/backend-syntax.yml"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Python syntax and notification modules (release candidate)
        run: python -m compileall backend
      - name: Test deterministic race replay
        run: python -m unittest discover -s backend -p 'test_*.py'
      - name: Check game JavaScript syntax
        run: python backend/check_frontend_syntax.py
