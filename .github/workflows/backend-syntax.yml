name: Backend syntax check

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-syntax.yml"
  push:
    branches:
      - "feature/mpesa-monthly-membership"
    paths:
      - "backend/**"
      - ".github/workflows/backend-syntax.yml"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q backend
      - name: Test deterministic race replay
        run: python -m unittest discover -s backend -p 'test_*.py'
